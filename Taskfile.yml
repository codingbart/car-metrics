version: '3'

tasks:
  default:
    desc: Uruchom aplikację
    cmds:
      - task: dev

  check:
    internal: true
    preconditions:
      - sh: command -v docker >/dev/null 2>&1
        msg: Zainstaluj Docker Desktop.
      - sh: docker compose version >/dev/null 2>&1
        msg: Wymagany Docker Compose v2.
      - sh: docker info >/dev/null 2>&1
        msg: Uruchom Docker Desktop i poczekaj na gotowość silnika.
    cmds:
      - docker compose config --quiet

  dev:
    desc: Zbuduj i uruchom aplikację (localhost:8501); zmiany w src/ przeładowują się same
    cmds:
      - task: check
      - docker compose up --build --remove-orphans

  stop:
    desc: Zatrzymaj aplikację; baza SQLite powstanie od nowa przy następnym starcie
    cmds:
      - task: check
      - docker compose down

  logs:
    desc: Obserwuj logi aplikacji
    cmds:
      - task: check
      - docker compose logs --follow --tail=100

  status:
    desc: Pokaż stan kontenera
    cmds:
      - task: check
      - docker compose ps
